<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#262626" />
  <title>PLACE MAKING WITH UDC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">PLACE MAKING WITH UDC</div>
      <div class="top-actions">
        <button id="thumbBtn" aria-label="缩略图">THUMBNAILS</button>
        <button id="fullscreenBtn" aria-label="全屏">FULLSCREEN</button>
      </div>
    </header>

    <section class="viewer" id="viewer">
      <button class="nav prev" id="prevBtn" aria-label="上一页">‹</button>
      <div class="book" id="book" tabindex="0" aria-label="项目册翻书阅读区">
        <div class="spread base" id="baseSpread"></div>
        <div class="spread turning" id="turningSpread"></div>
        <div class="corner-glow"></div>
      </div>
      <button class="nav next" id="nextBtn" aria-label="下一页">›</button>
      <div class="hint">← → / 滑动翻页</div>
    </section>

    <footer class="bottombar">
      <div class="title">深规院联创所 · 项目实践 2023–2026</div>
      <div class="counter"><span id="current">01</span><span class="slash">/</span><span id="total">48</span></div>
    </footer>
  </main>

  <aside class="thumbs" id="thumbs" aria-hidden="true">
    <div class="thumb-head"><span>CONTENTS</span><button id="closeThumb">×</button></div>
    <div class="thumb-grid" id="thumbGrid"></div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
